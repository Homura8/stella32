# Pinned builds for the ESP32-2432S028R. From the repository root:
#   arduino-cli compile --profile cyd examples/CYD        two 1.9 MB app slots: over-the-air updates (default)
#   arduino-cli compile --profile cyd-huge examples/CYD   one 3 MB app, no updates (for when the OS outgrows a slot)
#   arduino-cli compile --profile cyd --build-property "compiler.cpp.extra_flags=-DSTELLA_GIFT=1" examples/CYD
#                                                          a gift build: opens on a message (gift.example.h) first
#   arduino-cli compile --profile cyd-ble examples/CYD     the default plus the Deck app (a Bluetooth media-key pad); see
#                                                          docs/ARCHITECTURE.md, "Bluetooth deck", for what it costs
# Switching between them needs one USB flash (the partition table changes);
# settings and the saved Wi-Fi network are kept (NVS stays at the same address).
profiles:
  cyd:
    fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - TFT_eSPI (2.5.43)
      - XPT2046_Touchscreen (1.4.0)
      - dir: ../..   # this repository (Stella32)
  cyd-huge:
    fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - TFT_eSPI (2.5.43)
      - XPT2046_Touchscreen (1.4.0)
      - dir: ../..   # this repository (Stella32)
  cyd-ble:
    fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - TFT_eSPI (2.5.43)
      - XPT2046_Touchscreen (1.4.0)
      - NimBLE-Arduino (2.5.2)   # its presence turns the Deck app on (STELLA_HAS_BLE)
      - dir: ../..   # this repository (Stella32)
default_profile: cyd
